<div class="forgot-password-page d-flex align-items-center justify-content-center min-vh-100">
  <div class="forgot-password-card shadow-lg animate__animated animate__fadeInUp">
    <!-- Logo -->
    <div class="text-center mb-4">
      <img src="../../../../assets/images/logo.png" alt="Logo" class="login-logo" />
    </div>

    <h3 class="text-center mb-4 fw-bold">Mot de passe oublié</h3>

    <!-- Étape 1 : demander code -->
    <div *ngIf="step === 'requestCode'">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" class="form-control" placeholder="Entrez votre email" required />
      </div>
      <button (click)="requestCode()" [disabled]="isLoading" class="btn btn-primary w-100">Demander un code</button>
    </div>

    <!-- Étape 2 : valider code -->
    <div *ngIf="step === 'validateCode'">
      <div class="mb-3">
        <label for="email2" class="form-label">Email</label>
        <input type="email" id="email2" [(ngModel)]="email" name="email2" class="form-control" placeholder="Entrez votre email" required />
      </div>
      <div class="mb-3">
        <label for="code" class="form-label">Code reçu</label>
        <input type="text" id="code" [(ngModel)]="code" name="code" class="form-control" placeholder="Entrez le code" maxlength="6" required />
      </div>
      <button (click)="validateCode()" [disabled]="isLoading" class="btn btn-primary w-100">Valider le code</button>
    </div>

    <!-- Étape 3 : reset password -->
    <div *ngIf="step === 'resetPassword'">
      <div class="mb-3">
        <label for="newPassword" class="form-label">Nouveau mot de passe</label>
        <input type="password" id="newPassword" [(ngModel)]="newPassword" name="newPassword" class="form-control" placeholder="Entrez nouveau mot de passe" required />
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirmer mot de passe</label>
        <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirmer mot de passe" required />
      </div>
      <button (click)="resetPassword()" [disabled]="isLoading" class="btn btn-primary w-100">Réinitialiser le mot de passe</button>
    </div>

    <p *ngIf="message" class="success-message text-center mt-3">{{ message }}</p>
    <p *ngIf="error" class="error-message text-center mt-3">{{ error }}</p>
  </div>
</div>
