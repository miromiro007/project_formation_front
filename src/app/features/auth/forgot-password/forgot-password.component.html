<div class="forgot-password-container">
  <h2>Mot de passe oublié</h2>

  <!-- Étape 1 : demander code -->
  <div *ngIf="step === 'requestCode'">
    <label>Email</label>
    <input type="email" [(ngModel)]="email" name="email" required />
    <button (click)="requestCode()" [disabled]="isLoading">Demander un code</button>
  </div>

  <!-- Étape 2 : valider code -->
  <div *ngIf="step === 'validateCode'">
    <label>Email</label>
    <input type="email" [(ngModel)]="email" name="email" required />

    <label>Code reçu</label>
    <input type="text" [(ngModel)]="code" name="code" maxlength="6" required />

    <button (click)="validateCode()" [disabled]="isLoading">Valider le code</button>
  </div>

  <!-- Étape 3 : reset password -->
  <div *ngIf="step === 'resetPassword'">
    <label>Nouveau mot de passe</label>
    <input type="password" [(ngModel)]="newPassword" name="newPassword" required />

    <label>Confirmer mot de passe</label>
    <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required />

    <button (click)="resetPassword()" [disabled]="isLoading">Réinitialiser le mot de passe</button>
  </div>

  <p *ngIf="message" class="success-message">{{ message }}</p>
  <p *ngIf="error" class="error-message">{{ error }}</p>
</div>
